
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Research Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }
        
        .subtitle {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 30px;
        }
        
        #query {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        #query:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        .filter-group input, .filter-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        
        .checkbox-group input {
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }
        
        #searchBtn {
            background: #3498db;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        #searchBtn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.3);
        }
        
        #searchBtn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        
        #loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #results {
            margin-top: 40px;
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }
        
        .result-title {
            font-size: 1.2em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .result-authors {
            color: #7f8c8d;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        .result-abstract {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .result-meta {
            display: flex;
            gap: 20px;
            color: #95a5a6;
            font-size: 0.9em;
        }
        
        .summary-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .summary-box h2 {
            margin-bottom: 15px;
        }
        
        .api-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .api-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        
        .api-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Medical Research Agent</h1>
        <p class="subtitle">Search PubMed's biomedical literature with AI-powered analysis</p>
        
        <div class="search-box">
            <input type="text" id="query" placeholder="Enter your medical research query..." 
                   value="Latest treatments for Type 2 Diabetes">
        </div>
        
        <div class="filters">
            <div class="filter-group">
                <label for="dateFilter">Publication Date After</label>
                <input type="date" id="dateFilter" value="2022-01-01">
            </div>
            
            <div class="filter-group">
                <label for="maxResults">Max Results</label>
                <select id="maxResults">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>Options</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="openAccess">
                    <label for="openAccess">Open Access Only</label>
                </div>
            </div>
        </div>
        
        <button id="searchBtn" onclick="performSearch()">Search PubMed</button>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Searching PubMed and analyzing results...</p>
        </div>
        
        <div id="results"></div>
        
        <div class="api-link">
            <a href="http://localhost:8000/docs" target="_blank">API Documentation</a> | 
            <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank">PubMed</a>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        async function performSearch() {
            const query = document.getElementById('query').value;
            const dateFilter = document.getElementById('dateFilter').value;
            const maxResults = document.getElementById('maxResults').value;
            const openAccess = document.getElementById('openAccess').checked;
            
            if (!query.trim()) {
                alert('Please enter a search query');
                return;
            }
            
            // Show loading
            document.getElementById('searchBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            
            try {
                // Prepare filters
                const filters = {};
                if (dateFilter) {
                    filters.publication_date_start = dateFilter;
                }
                if (openAccess) {
                    filters.open_access = true;
                }
                filters.maxResults = parseInt(maxResults);
                
                // Make API request
                const response = await fetch(`${API_BASE}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        filters: filters
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'completed') {
                    // Display results
                    displayResults(data);
                } else if (data.status === 'failed') {
                    alert('Search failed: ' + (data.error || 'Unknown error'));
                }
                
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('searchBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            // Summary box
            if (data.summary) {
                const summaryHtml = `
                    <div class="summary-box">
                        <h2>AI Analysis Summary</h2>
                        <div>${formatSummary(data.summary)}</div>
                    </div>
                `;
                resultsDiv.innerHTML = summaryHtml;
            }
            
            // Get articles
            if (data.query_id) {
                fetchArticles(data.query_id);
            }
        }
        
        async function fetchArticles(queryId) {
            try {
                const response = await fetch(`${API_BASE}/api/query/${queryId}/articles`);
                const data = await response.json();
                
                if (data.articles && data.articles.length > 0) {
                    displayArticles(data.articles.slice(0, 10)); // Show first 10
                }
            } catch (error) {
                console.error('Error fetching articles:', error);
            }
        }
        
        function displayArticles(articles) {
            const resultsDiv = document.getElementById('results');
            
            const articlesHtml = articles.map(article => `
                <div class="result-card">
                    <div class="result-title">${article.title}</div>
                    <div class="result-authors">${formatAuthors(article.authors)}</div>
                    <div class="result-abstract">${truncateText(article.abstract, 200)}</div>
                    <div class="result-meta">
                        <span>📅 ${article.publication_date || 'Unknown'}</span>
                        <span>📰 ${article.journal || 'Unknown'}</span>
                        <span>🔗 PMID: ${article.pmid}</span>
                    </div>
                </div>
            `).join('');
            
            resultsDiv.innerHTML += '<h3 style="margin: 30px 0 20px;">Research Articles</h3>' + articlesHtml;
        }
        
        function formatSummary(summary) {
            return summary.replace(/\n/g, '<br>').replace(/##(.+)/g, '<h3>$1</h3>');
        }
        
        function formatAuthors(authors) {
            if (!authors || authors.length === 0) return 'Unknown authors';
            if (authors.length <= 3) return authors.join(', ');
            return authors.slice(0, 3).join(', ') + ' et al.';
        }
        
        function truncateText(text, maxLength) {
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }
        
        // Allow Enter key to search
        document.getElementById('query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
