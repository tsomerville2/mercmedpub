[behave]
# Default formatter
default_format = progress3
show_skipped = false
show_timings = true

# Output settings
stdout_capture = true
stderr_capture = true
log_capture = true
logging_level = INFO

# Test execution settings
stop_on_first_failure = false
summary = true

# Tag expressions for common test suites
# Run with: behave --tags=@critical
[behave.userdata]
# Critical tests only
critical = @critical
# MCP integration tests
mcp = @mcp
# API tests
api = @api
# Workflow tests
workflow = @workflow
# All integration tests
integration = @mcp or @api or @workflow

# Paths
[behave.paths]
features = features
steps = features/steps

# Formatters for different outputs
[behave.formatters]
progress = behave.formatter.progress:ProgressFormatter
progress3 = behave.formatter.progress:ScenarioProgressFormatter
json = behave.formatter.json:JSONFormatter
plain = behave.formatter.plain:PlainFormatter
pretty = behave.formatter.pretty:PrettyFormatter

# Test reports configuration
[behave.reports]
junit_directory = reports/junit
json_file = reports/test_results.json